services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    ports:
      - "5432:5432"
    volumes:
      - northstar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://northstar:northstar@postgres:5432/northstar
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:4732
      PORT: "4732"
      NODE_ENV: production
    ports:
      - "4732:4732"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  northstar-pg:
